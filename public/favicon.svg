<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bowGradClean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ff4d88" />
      <stop offset="50%" stopColor="#f43f7a" />
      <stop offset="100%" stopColor="#d81b60" />
    </linearGradient>
    <linearGradient id="bowKnotGradClean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ff75a0" />
      <stop offset="100%" stopColor="#e11d5f" />
    </linearGradient>
    <filter id="bowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f43f7a" flood-opacity="0.3" />
    </filter>
  </defs>
  <g transform="translate(0, 12)" filter="url(#bowGlow)">
    <!-- Left Loop -->
    <path d="M45 37.5 C40 18, 12 10, 8 26 C4 40, 22 55, 45 42 Z" fill="url(#bowGradClean)" stroke="#b9134a" stroke-width="3.5" stroke-linejoin="round" />
    <path d="M18 25 C25 22, 34 26, 38 34" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
    
    <!-- Right Loop -->
    <path d="M55 37.5 C60 18, 88 10, 92 26 C96 40, 78 55, 55 42 Z" fill="url(#bowGradClean)" stroke="#b9134a" stroke-width="3.5" stroke-linejoin="round" />
    <path d="M82 25 C75 22, 66 26, 62 34" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
    
    <!-- Ribbon Tails -->
    <path d="M40 42 C32 55, 20 68, 14 70 C24 67, 34 65, 43 50 Z" fill="url(#bowGradClean)" stroke="#b9134a" stroke-width="3" stroke-linejoin="round" />
    <path d="M60 42 C68 55, 80 68, 86 70 C76 67, 66 65, 57 50 Z" fill="url(#bowGradClean)" stroke="#b9134a" stroke-width="3" stroke-linejoin="round" />

    <!-- Center Knot -->
    <ellipse cx="50" cy="39" rx="11" ry="10" fill="url(#bowKnotGradClean)" stroke="#b9134a" stroke-width="3.5" />
    <ellipse cx="48" cy="36" rx="3.5" ry="2.5" fill="#ffffff" opacity="0.85" />
  </g>
</svg>