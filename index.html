<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon & App Icons (Optimized for Google Search & Browsers) -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ankitti" />
    <meta name="application-name" content="Ankitti" />
    <meta name="theme-color" content="#f5f1ff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17112a" media="(prefers-color-scheme: dark)" />
    <!-- Ankitti has its own light and dark themes, so browsers shouldn't repaint it. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="msapplication-TileColor" content="#f5f1ff" />

    <!-- Google Fonts — Plus Jakarta Sans (Clean Modern UI) & Quicksand (Kawaii Rounded Display) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Quicksand:wght@500;600;700&family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Primary SEO metadata -->
    <title>Ankitti: Free Spaced Repetition Flashcards &amp; Anki Alternative</title>
    <meta name="description" content="Ankitti is a free, cute flashcard app with Anki-style SM-2 spaced repetition. Open .apkg decks in your browser, review anytime, and study offline." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://ankitti.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ankitti.com/" />
    <meta property="og:site_name" content="Ankitti" />
    <meta property="og:title" content="Ankitti: Free Spaced Repetition Flashcards &amp; Anki Alternative" />
    <meta property="og:description" content="Ankitti is a free, cute flashcard app with Anki-style SM-2 spaced repetition. Open .apkg decks in your browser, review anytime, and study offline." />
    <meta property="og:image" content="https://ankitti.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ankitti, cute spaced repetition flashcards" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ankitti: Free Spaced Repetition Flashcards &amp; Anki Alternative" />
    <meta name="twitter:description" content="Ankitti is a free, cute flashcard app with Anki-style SM-2 spaced repetition. Open .apkg decks in your browser, review anytime, and study offline." />
    <meta name="twitter:image" content="https://ankitti.com/og-image.png" />
    <meta name="twitter:image:alt" content="Ankitti, cute spaced repetition flashcards" />

    <!-- Structured data. The FAQPage block is added at build time from the FAQ on the page. -->
    <script type="application/ld+json">
    [
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Ankitti",
        "url": "https://ankitti.com/",
        "logo": "https://ankitti.com/icon-512.png",
        "sameAs": ["https://github.com/Astidor/ankitti"]
      },
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Ankitti",
        "url": "https://ankitti.com/"
      },
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Ankitti",
        "url": "https://ankitti.com/",
        "image": "https://ankitti.com/og-image.png",
        "description": "A free spaced repetition flashcard app with Anki-style SM-2 scheduling, .apkg import, review-anytime mode, AI deck drafts and offline support.",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any (web browser), installable on iOS, Android, macOS, Windows and Linux",
        "browserRequirements": "Requires JavaScript and a modern browser",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "featureList": [
          "Anki-style SM-2 spaced repetition with four rating buttons",
          "Relearn any deck at any time",
          "Import Anki .apkg, .csv, .tsv and .json decks in the browser",
          "Cloze deletion cards",
          "Card drafts saved as you type",
          "AI deck drafts from a topic",
          "Focus timer",
          "Works offline as an installable app"
        ]
      }
    ]
    </script>
  </head>
  <body class="antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
